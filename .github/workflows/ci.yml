name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 本套件极度重视 Windows 兼容（GBK 对照臂 / BOM / %SystemDrive% 兜底 / spawnSync EBUSY 绕法），
    # 却只在 ubuntu 上跑过 CI。补三平台矩阵。统一 shell: bash 让 find/xargs、`VAR=val node` 内联 env
    # 这些 bash 写法在 windows-latest（Git Bash）/ macos 上同样成立。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查（全部 .mjs）
        run: |
          set -e
          find . -name '*.mjs' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: T2 判分管线自检（零 API 调用）
        run: node t2/smoke-ab.mjs --dry
      - name: demo 自检（样例技能库 → 先红后绿）
        run: node demo/run.mjs --assert
      - name: 解析器自检（F6，node:test，零依赖）
        run: node --test selftest.mjs
      - name: merge-eval 负例 drill（F5，临时 fixture 仓库，零 API 零网络）
        run: node merge-eval/drill-merge-eval.mjs
      - name: fleet-eval core 作用域自检（样例库 → 摘掉 fanout 5 项，零网络）
        run: |
          set -e
          FLEET_SHARED=demo/fixture-clean FLEET_SCOPE=core node fleet-eval/fleet-eval.mjs --trials 1
